name: Build and Push Image
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * 0' # weekly Sunday 4am UTC
  workflow_dispatch:

env:
  REGISTRY_USER: kingsleyzissou
  IMAGE_REGISTRY: ghcr.io/kingsleyzissou

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-22.04
    outputs:
      base: ${{ steps.filter.outputs.base }}
      desktop: ${{ steps.filter.outputs.desktop }}
      dev: ${{ steps.filter.outputs.dev }}
    steps:
    - uses: actions/checkout@v4

    - uses: dorny/paths-filter@v3
      id: filter
      if: github.event_name == 'push'
      with:
        filters: |
          base:
            - 'Containerfile.base'
            - 'files/base/**'
          desktop:
            - 'Containerfile.desktop'
            - 'files/desktop/**'
          dev:
            - 'Containerfile.dev'

  build:
    name: Build and push images
    needs: changes
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.base == 'true' ||
      needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.dev == 'true'
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Log in to ghcr.io
      uses: redhat-actions/podman-login@v1
      with:
        registry: ${{ env.IMAGE_REGISTRY }}
        username: ${{ env.REGISTRY_USER }}
        password: ${{ secrets.AUTH_TOKEN }}

    # Base
    - name: Build base image
      if: |
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.base == 'true'
      run: |
        podman build \
        --tag ${{ env.IMAGE_REGISTRY }}/hyprland-base:latest \
        --file Containerfile.base .

    - name: Push base image
      if: |
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.base == 'true'
      uses: redhat-actions/push-to-registry@v2
      with:
        registry: ${{ env.IMAGE_REGISTRY }}
        image: hyprland-base
        tags: latest

    # Desktop
    - name: Build desktop image
      if: |
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.base == 'true' ||
        needs.changes.outputs.desktop == 'true'
      run: |
        podman build \
        --secret id=container_auth,src=/run/user/1001/containers/auth.json \
        --tag ${{ env.IMAGE_REGISTRY }}/hyprland-desktop:latest \
        --file Containerfile.desktop .

    - name: Push desktop image
      if: |
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.base == 'true' ||
        needs.changes.outputs.desktop == 'true'
      uses: redhat-actions/push-to-registry@v2
      with:
        registry: ${{ env.IMAGE_REGISTRY }}
        image: hyprland-desktop
        tags: latest

    # Dev
    - name: Build dev image
      if: |
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.base == 'true' ||
        needs.changes.outputs.desktop == 'true' ||
        needs.changes.outputs.dev == 'true'
      run: |
        podman build \
        --tag ${{ env.IMAGE_REGISTRY }}/hyprland:latest \
        --file Containerfile.dev .

    - name: Push dev image
      if: |
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.base == 'true' ||
        needs.changes.outputs.desktop == 'true' ||
        needs.changes.outputs.dev == 'true'
      uses: redhat-actions/push-to-registry@v2
      with:
        registry: ${{ env.IMAGE_REGISTRY }}
        image: hyprland
        tags: latest
